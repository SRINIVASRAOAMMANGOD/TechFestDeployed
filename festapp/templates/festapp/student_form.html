{% extends "festapp/base.html" %}
{% load custom_filters %}

{% block content %}
<div class="container mt-4">
    <h2>{% if student %}Edit{% else %}Add{% endif %} Student</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group mb-3">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" name="name" 
                   value="{{ student.1|default:'' }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="roll_number">Roll Number</label>
            <input type="text" class="form-control" id="roll_number" name="roll_number" 
                   value="{{ student.2|default:'' }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" 
                   value="{{ student.3|default:'' }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="department_id">Department</label>
            <select class="form-select" id="department_id" name="department_id" required>
                {% for dept in departments %}
                <option value="{{ dept.0 }}" {% if student and dept.0 == student.4 %}selected{% endif %}>
                    {{ dept.1 }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
