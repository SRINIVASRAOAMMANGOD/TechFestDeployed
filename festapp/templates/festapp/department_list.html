{% extends 'festapp/base.html' %}

{% block content %}
<h2 class="display-6 mb-3">Departments</h2>
<a href="{% url 'department_add' %}" class="btn btn-success mb-2">Add Department</a>
<table class="table table-bordered table-hover table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>DEPARTMENT NAME</th>
            <th>HOD NAME</th>

            <th>ACTIONS</th>
        </tr>
    </thead>
    <tbody>
        {% for dept in object_list %}
        <tr>
            <td>{{ dept.id }}</td>
            <td>{{ dept.name }}</td>
            <td>{{ dept.hod_name }}</td>

            <td>
                <a href="{% url 'department_edit' dept.id %}" class="btn btn-warning btn-sm">Edit</a>
                <a href="{% url 'department_delete' dept.id %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No departments found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
