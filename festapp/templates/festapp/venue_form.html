{% extends "festapp/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>{% if venue %}Edit{% else %}Add{% endif %} Venue</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group mb-3">
            <label for="name">Venue Name</label>
            <input type="text" class="form-control" id="name" name="name" 
                   value="{{ venue.0|default:'' }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="location">Location</label>
            <input type="text" class="form-control" id="location" name="location" 
                   value="{{ venue.1|default:'' }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="capacity">Capacity</label>
            <input type="number" class="form-control" id="capacity" name="capacity" 
                   value="{{ venue.2|default:'' }}" required>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'venue_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
